<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070912">
  <meta name="robots" content="noindex,nofollow">
  <title>PlayTalk | Learn languages through games</title>
  <meta name="description" content="PlayTalk turns language practice into 10-minute AI voice quests. 用游戏场景练语言，先在国内与美国市场开启内测。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="language-page">
    <div class="language-shell">
      <a class="brand" href="./" aria-label="PlayTalk home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8 6.8v10.4l8.5-5.2L8 6.8Z" fill="currentColor"/>
            <path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span>PlayTalk</span>
      </a>

      <h1>用游戏，<span class="accent">练语言。</span></h1>
      <p>选择一个版本进入。Choose your landing page.</p>

      <div class="language-grid">
        <a class="language-card" href="cn/">
          <span class="flag" aria-hidden="true">🎮</span>
          <h2>中国大陆版</h2>
          <p>面向中文玩家，用外服开黑、电竞、留学和游戏求职场景练英语口语。</p>
          <span class="go">进入中文页面 →</span>
        </a>

        <a class="language-card" href="us/">
          <span class="flag" aria-hidden="true">🌸</span>
          <h2>US / English</h2>
          <p>Learn Japanese through gaming, anime, conventions, and real voice-chat scenarios.</p>
          <span class="go">Open English page →</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
